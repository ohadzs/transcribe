[project]
name = "transcribe"
version = "0.1.0"
description = "Transcribe Hebrew audio (files, YouTube, podcasts) with ivrit.ai Whisper models"
requires-python = ">=3.10,<3.14"
dependencies = [
    "tqdm>=4.66",
    "yt-dlp>=2025.1.1",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.scripts]
transcribe = "transcribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]
